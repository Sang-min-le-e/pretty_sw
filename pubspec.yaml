name: routine_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_reactive_ble: ^5.5.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.1
  flutter_tts: ^4.2.5
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Figma가 쓰는 Noto Sans(SIL OFL 라이선스). 영문·숫자는 NotoSans, 한글은
    # NotoSansKR에서 가져온다(테마의 fontFamilyFallback 참고).
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
